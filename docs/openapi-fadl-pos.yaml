# Fadl POS — единый OpenAPI 3.1 для фронта (login, QR, смена POS).
# Импорт в Swagger UI / Postman; baseUrl = хост сайта Frappe.
# RPC: /api/method/<dotted.path> (Frappe SDK), не /api/v2/method.

openapi: 3.1.0
info:
  title: Fadl POS API
  description: |
    **Авторизация:** только заголовок **`Authorization`** = значение поля **`token`** из `login` / `login_qr` (`Basic <base64>…`). Cookie **`sid`** не используется.

    **Транспорт:** Frappe JS SDK и классический **`POST`/`GET` `/api/method/...`**. Тело — JSON с полями на верхнем уровне или `application/x-www-form-urlencoded`.

    **Модули:**
    - Логин и QR-токен (гостевые `login` / `login_qr` с rate limit).
    - Смена POS (`get_list`, `open_shift`, `close_shift`) — только с валидным `Authorization`. Суммы смены и способы оплаты завязаны на тип **Cash** в ERPNext; см. описание тега **POS session**.

    Секреты и внутренние поля QR в ответах не раскрываются.
  version: 1.0.0

servers:
  - url: https://{site}
    variables:
      site:
        default: your-site.localhost
        description: Хост Frappe

tags:
  - name: Password login
    description: Логин по паролю (гостевой POST).
  - name: QR login
    description: Логин по QR blob и PIN (гостевой POST).
  - name: QR setup
    description: Генерация и сброс QR (токен).
  - name: POS session
    description: |
      Смена POS после логина по токену. **Касса и способы оплаты (ERPNext):**
      - В **`get_list`**: если смена **уже открыта**, в **`pos_profiles`** приходит **только этот профиль** (остальные кассы не показываются). Если смена **не открыта** — все назначенные пользователю профили со **`status: Close`** и подсказками для открытия.
      - При **`open_shift`** в документ **POS Opening Entry** попадают **все** способы оплаты профиля по порядку: для **не-Cash** стартовая сумма **0**, если в **`balance_details`** не передали другое. В **`balance_details`** **обязательна** непустая **`opening_amount`** только для способов типа **Cash** (имя способа — **`name`** из `payment_methods`).
      - При **`close_shift`** в **`closing_data`** для **Cash** фактическую **`closing_amount`** передать **обязательно**, иначе будет ошибка. Для **не-Cash** сумму можно не указывать — подставится ожидаемая (`expected_amount`); если указать — будет использовано переданное значение.

paths:
  /api/method/fadl_pos.api.login.login_endpoints.login:
    post:
      tags: [Password login]
      summary: Логин по usr / pwd
      operationId: fadlPosLoginPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperAuthToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '417': { $ref: '#/components/responses/ExpectationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/method/fadl_pos.api.login.login_endpoints.login_qr:
    post:
      tags: [QR login]
      summary: Логин по encrypted_qr и PIN
      operationId: fadlPosLoginQr
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QRLoginRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/QRLoginRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperAuthToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/method/fadl_pos.api.login.login_endpoints.generate_qr:
    post:
      tags: [QR setup]
      summary: Сгенерировать QR payload
      operationId: fadlPosGenerateQr
      security: [{ FadlPosToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QRGenerateRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/QRGenerateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperQRGenerate' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/method/fadl_pos.api.login.login_endpoints.clear_sessions:
    post:
      tags: [QR setup]
      summary: Сбросить API secret и QR
      operationId: fadlPosClearSessions
      security: [{ FadlPosToken: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperAuthToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/method/fadl_pos.api.session.get_list:
    get:
      tags: [POS session]
      summary: Данные профилей и статус смены
      description: |
        В **`message`** — массив из одного объекта с **`pos_profiles`**.

        **Открытая смена:** в **`pos_profiles`** ровно **один** элемент — профиль текущей смены (`status: Open`, `opening_entry`), без `payment_methods` / `checklists`.

        **Смена закрыта:** все доступные пользователю профили с **`status: Close`**; для каждого приходят **`payment_methods`** и **`checklists`**.
        В **`payment_methods`** поле **`required_ob`** = `true` означает, что при **`open_shift`** нужно передать **`opening_amount`**
        для этого способа (это способы типа **Cash** в ERPNext). **`name`** — идентификатор способа оплаты для **`mode_of_payment`** в **`balance_details`**.
      operationId: fadlPosSessionGetList
      security: [{ FadlPosToken: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [POS session]
      summary: То же, что GET (удобно для SDK)
      description: |
        См. GET: **`payment_methods`**, флаг **`required_ob`** (стартовая сумма только для Cash) и связь с **`open_shift`** / **`balance_details`**.
      operationId: fadlPosSessionGetListPost
      security: [{ FadlPosToken: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/method/fadl_pos.api.session.open_shift:
    post:
      tags: [POS session]
      summary: Открыть смену (POS Opening Entry)
      description: |
        **`balance_details`** — массив `{ "mode_of_payment", "opening_amount" }` или JSON-строка; допустим и уже распарсенный массив в теле JSON.

        **Обработка:** в **POS Opening Entry** создаётся **по одной строке на каждый** способ оплаты из профиля. Для **Cash** в `balance_details` должна быть строка с тем же **`mode_of_payment`**, что **`name`** из `get_list` → `payment_methods`, и **непустой** **`opening_amount`**. Для **не-Cash** строку в запросе можно **не присылать** — на документе сумма будет **0**; если прислали — используется переданное **`opening_amount`**.

        Ориентируйтесь на **`payment_methods[].required_ob`** (Cash) и **`name`** из ответа **`get_list`**.
      operationId: fadlPosSessionOpenShift
      security: [{ FadlPosToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenShiftRpcBody' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OpenShiftRpcBody' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '417': { $ref: '#/components/responses/ExpectationFailed' }

  /api/method/fadl_pos.api.session.close_shift:
    post:
      tags: [POS session]
      summary: Закрыть смену по имени opening entry
      description: |
        **`closing_data`** — опционально массив `{ "mode_of_payment", "closing_amount" }` или JSON-строка.

        **Реальная обработка:**
        - Для способов типа **Cash** фактическую **`closing_amount`** нужно передать в `closing_data` (для каждой соответствующей строки сверки), иначе сервер вернёт ошибку.
        - Для **не-Cash** строку в `closing_data` можно **не присылать** — подставится **`expected_amount`** (ожидаемый остаток); если **прислать** — будет использовано ваше **`closing_amount`**.
      operationId: fadlPosSessionCloseShift
      security: [{ FadlPosToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseShiftRpcBody' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/CloseShiftRpcBody' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperCloseShift' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '417': { $ref: '#/components/responses/ExpectationFailed' }

components:
  securitySchemes:
    FadlPosToken:
      type: apiKey
      in: header
      name: Authorization
      description: Значение **`token`** из ответа логина; заголовок на каждый защищённый запрос.

  schemas:
    LoginRequest:
      type: object
      required: [usr, pwd]
      properties:
        usr: { type: string }
        pwd: { type: string, format: password }

    QRLoginRequest:
      type: object
      required: [encrypted_qr, pin_code]
      properties:
        encrypted_qr: { type: string }
        pin_code: { type: string, pattern: '^\\d{6}$' }

    QRGenerateRequest:
      type: object
      required: [pin_code]
      properties:
        pin_code: { type: string, pattern: '^\\d{6}$' }

    AuthTokenResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }

    QRGenerateResponse:
      type: object
      required: [encrypted_qr]
      properties:
        encrypted_qr: { type: string }

    BalanceDetailRow:
      type: object
      required: [mode_of_payment, opening_amount]
      properties:
        mode_of_payment:
          type: string
          description: Имя способа оплаты (как `payment_methods[].name` в get_list); фактически учитываются только способы типа Cash.
        opening_amount:
          type: number
          description: Стартовая сумма по кассе для этого Cash-способа.

    ClosingRow:
      type: object
      required: [mode_of_payment, closing_amount]
      properties:
        mode_of_payment:
          type: string
          description: Имя способа оплаты; для Cash закрытие без строки в closing_data приведёт к ошибке.
        closing_amount:
          type: number
          description: Фактический остаток; для не-Cash при отсутствии строки подставится expected_amount.

    OpenShiftRpcBody:
      type: object
      required: [pos_profile, company, balance_details]
      properties:
        pos_profile: { type: string }
        company: { type: string }
        balance_details:
          description: |
            Массив или JSON-строка. На сервере остаются только элементы для **Cash** из профиля; остальное отбрасывается.
          oneOf:
            - type: string
            - type: array
              items: { $ref: '#/components/schemas/BalanceDetailRow' }
        comment:
          type: string
          maxLength: 4000
          description: |
            Опционально. Текст комментария к **POS Opening Entry** после submit — как «Add Comment» в Desk (`Comment`, тип Comment).

    CloseShiftRpcBody:
      type: object
      required: [opening_entry_name]
      properties:
        opening_entry_name: { type: string }
        closing_data:
          description: |
            Опционально. Обязательны явные **closing_amount** для **Cash**; для не-Cash можно не передавать строку.
          oneOf:
            - type: string
            - type: array
              items: { $ref: '#/components/schemas/ClosingRow' }
        comment:
          type: string
          maxLength: 4000
          description: |
            Опционально. Комментарий к **POS Closing Entry** после submit (`Comment` doctype), виден в ленте документа в Desk.

    CloseShiftResult:
      type: object
      properties:
        status: { type: string }
        closing_entry: { type: string }
        is_final: { type: boolean }
        entry_status: { type: string }
        error_message: { type: string, nullable: true }

    PosProfileRow:
      type: object
      properties:
        name: { type: string }
        status: { type: string, description: 'Open или Close' }
        company: { type: string }
        opening_entry: { type: string, nullable: true }
        opening_entry_date:
          type: string
          format: date-time
          description: Только при **Open** — дата/время начала смены (`period_start_date` POS Opening Entry).
        checklists:
          type: array
          items:
            type: object
            properties:
              opening:
                type: array
                items: { type: object, properties: { title: { type: string } } }
              closing:
                type: array
                items: { type: object, properties: { title: { type: string } } }
        payment_methods:
          description: Только для status Close. Список способов оплаты POS Profile из ERPNext.
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Идентификатор способа оплаты — используйте как mode_of_payment в balance_details / closing_data.
              default:
                type: integer
                description: Признак способа по умолчанию в профиле.
              type:
                type: string
                description: Тип способа оплаты в ERPNext (например Cash, Bank и т.д.).
              required_ob:
                type: boolean
                description: true = при открытии смены обязательна стартовая сумма (opening_amount); совпадает с типом Cash.

    SessionListBlock:
      type: object
      required: [pos_profiles]
      properties:
        pos_profiles:
          type: array
          items: { $ref: '#/components/schemas/PosProfileRow' }

    MessageWrapperAuthToken:
      type: object
      properties:
        message:
          oneOf:
            - { $ref: '#/components/schemas/AuthTokenResponse' }
            - { type: string }

    MessageWrapperQRGenerate:
      type: object
      properties:
        message:
          oneOf:
            - { $ref: '#/components/schemas/QRGenerateResponse' }
            - { type: string }

    MessageWrapperSessionList:
      type: object
      description: Результат get_list / open_shift — список из одного блока с pos_profiles
      properties:
        message:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/SessionListBlock' }
            - { type: string }

    MessageWrapperCloseShift:
      type: object
      properties:
        message:
          oneOf:
            - { $ref: '#/components/schemas/CloseShiftResult' }
            - { type: string }

    FrappeErrorBody:
      type: object
      properties:
        _server_messages: { type: string }
        exc_type: { type: string }
        exception: { type: string }

  responses:
    Unauthorized:
      description: Нет или неверный токен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrappeErrorBody' }
    ExpectationFailed:
      description: Ошибка приложения (часто HTTP 417 в Frappe)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrappeErrorBody' }
    TooManyRequests:
      description: Rate limit на гостевой логин
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrappeErrorBody' }
