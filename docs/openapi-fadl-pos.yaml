# Fadl POS — единый OpenAPI 3.1 для фронта (login, QR, смена POS).
# Импорт в Swagger UI / Postman; baseUrl = хост сайта Frappe.
# RPC: /api/method/<dotted.path> (Frappe SDK), не /api/v2/method.

openapi: 3.1.0
info:
  title: Fadl POS API
  description: |
    **Авторизация:** только заголовок **`Authorization`** = значение поля **`token`** из `login` / `login_qr` (`Basic <base64>…`). Cookie **`sid`** не используется.

    **Транспорт:** Frappe JS SDK и классический **`POST`/`GET` `/api/method/...`**. Тело — JSON с полями на верхнем уровне или `application/x-www-form-urlencoded`.

    **Модули:**
    - Логин и QR-токен (гостевые `login` / `login_qr` с rate limit).
    - Смена POS (`get_list`, `open_shift`, `close_shift`) — только с валидным `Authorization`. Обязательные суммы задаются полем **Required Opening Balance** на POS Profile; см. тег **POS session**.

    Секреты и внутренние поля QR в ответах не раскрываются.
  version: 1.0.0

servers:
  - url: https://{site}
    variables:
      site:
        default: your-site.localhost
        description: Хост Frappe

tags:
  - name: Password login
    description: Логин по паролю (гостевой POST).
  - name: QR login
    description: Логин по QR blob и PIN (гостевой POST).
  - name: QR setup
    description: Генерация и сброс QR (токен).
  - name: POS session
    description: |
      Смена POS после логина по токену. **Касса и способы оплаты (ERPNext):**
      - В **`get_list`**: если смена **уже открыта**, в **`pos_profiles`** приходит **только этот профиль** (остальные кассы не показываются). Если смена **не открыта** — все назначенные пользователю профили со **`status: Close`** и подсказками для открытия.
      - В Desk на строке **POS Payment Method** включите **Required Opening Balance** для способов, по которым кассир вводит стартовую/фактическую сумму.
      - **`get_list`** → **`payment_methods`**: только такие способы, каждый `{"name": "<Mode of Payment>"}`.
      - **`open_shift`** → **`balance_details`**: `{"name", "opening_amount"}` для каждого `name` из списка; лишние имена игнорируются; остальные способы профиля на документе с **0**.
      - **`close_shift`** → **`closing_data`**: `{"name", "closing_amount"}` только для обязательных; остальное игнорируется; на документе не-обязательные → **expected_amount**.

paths:
  /api/method/fadl_pos.api.login.login_endpoints.login:
    post:
      tags: [Password login]
      summary: Логин по usr / pwd
      operationId: fadlPosLoginPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperAuthToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '417': { $ref: '#/components/responses/ExpectationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/method/fadl_pos.api.login.login_endpoints.login_qr:
    post:
      tags: [QR login]
      summary: Логин по encrypted_qr и PIN
      operationId: fadlPosLoginQr
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QRLoginRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/QRLoginRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperAuthToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/method/fadl_pos.api.login.login_endpoints.generate_qr:
    post:
      tags: [QR setup]
      summary: Сгенерировать QR payload
      operationId: fadlPosGenerateQr
      security: [{ FadlPosToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QRGenerateRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/QRGenerateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperQRGenerate' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/method/fadl_pos.api.login.login_endpoints.clear_sessions:
    post:
      tags: [QR setup]
      summary: Сбросить API secret и QR
      operationId: fadlPosClearSessions
      security: [{ FadlPosToken: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperAuthToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/method/fadl_pos.api.session.get_list:
    get:
      tags: [POS session]
      summary: Данные профилей и статус смены
      description: |
        В **`message`** — массив из одного объекта с **`pos_profiles`**.

        **Открытая смена:** в **`pos_profiles`** ровно **один** элемент — профиль текущей смены (`status: Open`, `opening_entry`), без `payment_methods` / `checklists`.

        **Смена закрыта:** все доступные пользователю профили с **`status: Close`**; для каждого приходят **`payment_methods`** (только с **Required Opening Balance**) и **`checklists`**.
        Каждый элемент **`payment_methods`**: `{"name": "<Mode of Payment>"}` — те же **`name`** в **`balance_details`** / **`closing_data`**.
      operationId: fadlPosSessionGetList
      security: [{ FadlPosToken: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [POS session]
      summary: То же, что GET (удобно для SDK)
      description: |
        См. GET: **`payment_methods`** и связь с **`open_shift`** / **`balance_details`** по полю **`name`**.
      operationId: fadlPosSessionGetListPost
      security: [{ FadlPosToken: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/method/fadl_pos.api.session.open_shift:
    post:
      tags: [POS session]
      summary: Открыть смену (POS Opening Entry)
      description: |
        **`balance_details`** — массив `{ "name", "opening_amount" }` или JSON-строка.

        **Обработка:** в **POS Opening Entry** — **все** способы профиля; суммы только для **`name`** из `get_list` → `payment_methods` (флаг в Desk); остальные **0**. Лишние **`name`** в запросе игнорируются.
      operationId: fadlPosSessionOpenShift
      security: [{ FadlPosToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenShiftRpcBody' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OpenShiftRpcBody' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '417': { $ref: '#/components/responses/ExpectationFailed' }

  /api/method/fadl_pos.api.session.close_shift:
    post:
      tags: [POS session]
      summary: Закрыть смену по имени opening entry
      description: |
        **`closing_data`** — опционально массив `{ "name", "closing_amount" }` или JSON-строка.

        **Обработка:** для каждого способа с **Required Opening Balance** нужна строка с **`closing_amount`**; лишние **`name`** игнорируются; остальные способы на документе получают **`expected_amount`**.
      operationId: fadlPosSessionCloseShift
      security: [{ FadlPosToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseShiftRpcBody' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/CloseShiftRpcBody' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageWrapperCloseShift' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '417': { $ref: '#/components/responses/ExpectationFailed' }

components:
  securitySchemes:
    FadlPosToken:
      type: apiKey
      in: header
      name: Authorization
      description: Значение **`token`** из ответа логина; заголовок на каждый защищённый запрос.

  schemas:
    LoginRequest:
      type: object
      required: [usr, pwd]
      properties:
        usr: { type: string }
        pwd: { type: string, format: password }

    QRLoginRequest:
      type: object
      required: [encrypted_qr, pin_code]
      properties:
        encrypted_qr: { type: string }
        pin_code: { type: string, pattern: '^\\d{6}$' }

    QRGenerateRequest:
      type: object
      required: [pin_code]
      properties:
        pin_code: { type: string, pattern: '^\\d{6}$' }

    AuthTokenResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }

    QRGenerateResponse:
      type: object
      required: [encrypted_qr]
      properties:
        encrypted_qr: { type: string }

    BalanceDetailRow:
      type: object
      required: [name, opening_amount]
      properties:
        name:
          type: string
          description: Mode of Payment (как `payment_methods[].name` в get_list).
        opening_amount:
          type: number
          description: Стартовая сумма для этого способа.

    ClosingRow:
      type: object
      required: [name, closing_amount]
      properties:
        name:
          type: string
          description: Mode of Payment с Required Opening Balance; без строки — ошибка при close.
        closing_amount:
          type: number
          description: Фактический остаток по кассе.

    OpenShiftRpcBody:
      type: object
      required: [pos_profile, company, balance_details]
      properties:
        pos_profile: { type: string }
        company: { type: string }
        balance_details:
          description: |
            Массив или JSON-строка. Учитываются только `name` из payment_methods (Required Opening Balance).
          oneOf:
            - type: string
            - type: array
              items: { $ref: '#/components/schemas/BalanceDetailRow' }
        comment:
          type: string
          maxLength: 4000
          description: |
            Опционально. Текст комментария к **POS Opening Entry** после submit — как «Add Comment» в Desk (`Comment`, тип Comment).

    CloseShiftRpcBody:
      type: object
      required: [opening_entry_name]
      properties:
        opening_entry_name: { type: string }
        closing_data:
          description: |
            Опционально. `name` + `closing_amount` для каждого обязательного способа из профиля.
          oneOf:
            - type: string
            - type: array
              items: { $ref: '#/components/schemas/ClosingRow' }
        comment:
          type: string
          maxLength: 4000
          description: |
            Опционально. Комментарий к **POS Closing Entry** после submit (`Comment` doctype), виден в ленте документа в Desk.

    CloseShiftResult:
      type: object
      properties:
        status: { type: string }
        closing_entry: { type: string }
        is_final: { type: boolean }
        entry_status: { type: string }
        error_message: { type: string, nullable: true }

    PosProfileRow:
      type: object
      properties:
        name: { type: string }
        status: { type: string, description: 'Open или Close' }
        company: { type: string }
        opening_entry: { type: string, nullable: true }
        opening_entry_date:
          type: string
          format: date-time
          description: Только при **Open** — дата/время начала смены (`period_start_date` POS Opening Entry).
        checklists:
          type: array
          items:
            type: object
            properties:
              opening:
                type: array
                items: { type: object, properties: { title: { type: string } } }
              closing:
                type: array
                items: { type: object, properties: { title: { type: string } } }
        payment_methods:
          description: Только для status Close. Способы с Required Opening Balance на POS Profile.
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                description: Mode of Payment — тот же `name` в balance_details / closing_data.

    SessionListBlock:
      type: object
      required: [pos_profiles]
      properties:
        pos_profiles:
          type: array
          items: { $ref: '#/components/schemas/PosProfileRow' }

    MessageWrapperAuthToken:
      type: object
      properties:
        message:
          oneOf:
            - { $ref: '#/components/schemas/AuthTokenResponse' }
            - { type: string }

    MessageWrapperQRGenerate:
      type: object
      properties:
        message:
          oneOf:
            - { $ref: '#/components/schemas/QRGenerateResponse' }
            - { type: string }

    MessageWrapperSessionList:
      type: object
      description: Результат get_list / open_shift — список из одного блока с pos_profiles
      properties:
        message:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/SessionListBlock' }
            - { type: string }

    MessageWrapperCloseShift:
      type: object
      properties:
        message:
          oneOf:
            - { $ref: '#/components/schemas/CloseShiftResult' }
            - { type: string }

    FrappeErrorBody:
      type: object
      properties:
        _server_messages: { type: string }
        exc_type: { type: string }
        exception: { type: string }

  responses:
    Unauthorized:
      description: Нет или неверный токен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrappeErrorBody' }
    ExpectationFailed:
      description: Ошибка приложения (часто HTTP 417 в Frappe)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrappeErrorBody' }
    TooManyRequests:
      description: Rate limit на гостевой логин
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrappeErrorBody' }
